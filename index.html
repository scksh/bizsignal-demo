      historical: false, noticeNumber: notice.bidNtceNo, revision: notice.bidNtceOrd,
      category: notice.category, organizationId: notice.organizationId,
      budget: notice.budget, deadline: notice.deadline, summary: notice.summary,
      tags: [...(notice.tags || [])],
    });
    const organization = addOrganization(notice);
    addEdge(organization.id, notice.id, 'ISSUES', '발주 예시', 'mock-key', [notice.id, organization.id]);
    const documents = (notice.documents || []).map((document, index) => {
      const node = addNode(`doc:${notice.id}:${index}`, 'document', document.title, {
        noticeId: notice.id, format: document.type, section: document.section, excerpt: document.excerpt,
      });
      addEdge(notice.id, node.id, 'HAS_DOCUMENT', '첨부 예시', 'mock-key', [node.id]);
      return node;
    });
    (notice.requirements || []).forEach((requirement, index) => {
      const [title, ...parts] = String(requirement.source || '').replace(/^가상 /, '').split(' · ');
      const section = parts.join(' · ');
      const document = documents.find(node => node.label === title && node.meta.section === section);
      const node = addNode(`requirement:${notice.id}:${index}`, 'requirement', requirement.label, {
        noticeId: notice.id, detail: requirement.detail, source: requirement.source,
        documentId: document?.id || null,
      });
      if (document) addEdge(document.id, node.id, 'DESCRIBES', '조건 발췌 예시', 'derived', [document.id]);
      else addEdge(notice.id, node.id, 'HAS_UNVERIFIED_REQUIREMENT', '문서 근거 미확인', 'derived', [notice.id, node.id]);
    });
    for (const keyword of notice.tags || []) {
      const technology = addTechnology(notice.id, keyword);
      for (const document of documents) {
        if (normalize(document.meta.excerpt).includes(normalize(keyword))) {
          addEdge(document.id, technology.id, 'MENTIONS', '문구 포함', 'derived', [document.id]);
        }
      }
    }
  }

  for (const project of historicalProjects) {
    const noticeId = `hist:${project.id}`;
    addNode(noticeId, 'notice', project.title, {
      historical: true, recordId: project.id, year: project.year, month: project.month,
      category: project.category, organizationId: project.organizationId,
      noticeNumber: project.noticeNumber, awardNumber: project.awardNumber ?? null,
      contractNumber: project.contractNumber ?? null, contractAmount: project.contractAmount ?? null,
      supplier: project.supplier ?? null, linkStatus: project.linkStatus,
    });
    const organization = addOrganization(project);
    addEdge(organization.id, noticeId, 'ISSUES', '과거 발주 예시', 'mock-key', [noticeId, organization.id]);
    let award = null;
    let contract = null;
    let supplier = null;
    if (project.supplier) supplier = addNode(`supplier:${token(project.supplier)}`, 'supplier', project.supplier, { identityBasis: '가상 업체명 정규화 · 실제 사업자 식별 아님' });
    if (project.awardNumber) {
      award = addNode(`award:${project.id}`, 'award', '과거 낙찰 결과', { noticeId, number: project.awardNumber, supplier: project.supplier ?? null });
      addEdge(noticeId, award.id, 'HAS_AWARD', '낙찰 예시', 'mock-key', [noticeId, award.id]);
      if (supplier) addEdge(award.id, supplier.id, 'AWARDED_TO', '낙찰업체 예시', 'mock-key', [award.id, supplier.id]);
    }
    if (project.contractNumber) {
      contract = addNode(`contract:${project.id}`, 'contract', `계약 ${money(project.contractAmount)}`, { noticeId, number: project.contractNumber, amount: project.contractAmount ?? null });
      addEdge(award?.id || noticeId, contract.id, award ? 'RESULTED_IN_CONTRACT' : 'HAS_CONTRACT', '계약 연결 예시', 'mock-key', [noticeId, contract.id]);
      if (supplier) addEdge(contract.id, supplier.id, 'CONTRACTED_WITH', '계약업체 예시', 'mock-key', [noticeId, contract.id, supplier.id]);
    }
    for (const keyword of project.technologies || []) addTechnology(noticeId, keyword);
    for (const current of notices) {
      if (current.category === project.category) {
        addEdge(current.id, noticeId, 'SIMILAR_TO', '같은 분야의 비교 후보', 'candidate', [current.id, noticeId]);
      }
    }
  }

  return {
    nodes: [...nodes.values()], edges: [...edges.values()],
    meta: {
      synthetic: true, rawApiVerified: false, retrieval: '브라우저 로컬 그래프의 BFS 경로 검색',
      generation: '결정론적 규칙 응답 · LLM 미연결',
      description: 'mock-key는 가상 행의 연결입니다. 실제 원천 식별키를 검증한 관계가 아닙니다. 후보 관계는 계약 관계로 사용하지 않습니다.',
    },
  };
}

function graphIndex(graph) {
  const nodes = new Map(graph.nodes.map(node => [node.id, node]));
  const adjacent = new Map(graph.nodes.map(node => [node.id, []]));
  for (const edge of graph.edges) {
    if (!nodes.has(edge.source) || !nodes.has(edge.target)) continue;
    adjacent.get(edge.source).push({ edge, next: edge.target });
    adjacent.get(edge.target).push({ edge, next: edge.source });
  }
  return { nodes, adjacent };
}

function relatedHistory(graph, noticeId, limit = 3) {
  const { nodes } = graphIndex(graph);
  const focus = nodes.get(noticeId);
  return graph.edges.filter(edge => edge.source === noticeId && edge.type === 'SIMILAR_TO')
    .map(edge => nodes.get(edge.target)).filter(Boolean)
    .sort((a, b) => Number(b.meta.organizationId === focus?.meta.organizationId) - Number(a.meta.organizationId === focus?.meta.organizationId)
      || Number(b.meta.year) - Number(a.meta.year) || Number(b.meta.month) - Number(a.meta.month) || a.id.localeCompare(b.id))
    .slice(0, limit);
}

/** 선택한 공고 주변의 문서·조건과 최대 세 개 과거 사업을 제한된 크기로 반환한다. */
function getNoticeContext(graph, noticeId) {
  const { nodes, adjacent } = graphIndex(graph);
  const focus = nodes.get(noticeId);
  if (!focus || focus.type !== 'notice' || focus.meta.historical) return { nodes: [], edges: [], focusId: noticeId };
  const selected = new Set([noticeId]);
  const add = id => { if (nodes.has(id) && selected.size < MAX_CONTEXT_NODES) selected.add(id); };
  for (const { edge, next } of adjacent.get(noticeId)) {
    if (edge.type !== 'SIMILAR_TO') add(next);
  }
  for (const id of [...selected]) {
    if (nodes.get(id).type === 'document') {
      for (const { edge, next } of adjacent.get(id)) if (edge.type === 'DESCRIBES') add(next);
    }
  }
  for (const project of relatedHistory(graph, noticeId)) {
    add(project.id);
    const queue = [{ id: project.id, depth: 0 }];
    const visited = new Set();
    while (queue.length) {
      const current = queue.shift();
      if (visited.has(current.id) || current.depth > 3) continue;
      visited.add(current.id);
      for (const { edge, next } of adjacent.get(current.id) || []) {
        if (edge.type === 'SIMILAR_TO') continue;
        const node = nodes.get(next);
        if (node.type === 'notice' && next !== project.id) continue;
        if (node.type === 'document' || node.type === 'requirement') continue;
        if (node.meta.noticeId && node.meta.noticeId !== project.id) continue;
        add(next);
        if (node.type === 'award' || node.type === 'contract') queue.push({ id: next, depth: current.depth + 1 });
      }
    }
  }
  return { nodes: graph.nodes.filter(node => selected.has(node.id)), edges: graph.edges.filter(edge => selected.has(edge.source) && selected.has(edge.target)), focusId: noticeId };
}

/** 현재 그래프에 존재하는 인접 관계만 BFS로 탐색한다. */
function findPath(graph, start, target, types, allowedNodes) {
  const { nodes, adjacent } = graphIndex(graph);
  if (!nodes.has(start) || !nodes.has(target)) return null;
  const queue = [{ id: start, nodeIds: [start], edgeIds: [] }];
  const visited = new Set([start]);
  while (queue.length) {
    const current = queue.shift();
    if (current.id === target) return { nodeIds: current.nodeIds, edgeIds: current.edgeIds };
    for (const { edge, next } of adjacent.get(current.id) || []) {
      if ((types && !types.has(edge.type)) || (allowedNodes && !allowedNodes.has(next)) || visited.has(next)) continue;
      visited.add(next);
      queue.push({ id: next, nodeIds: [...current.nodeIds, next], edgeIds: [...current.edgeIds, edge.id] });
    }
  }
  return null;
}

const forbiddenQuestion = question => /승률|성공\s*확률|낙찰\s*확률|확률|투찰|낙찰가|가격|신용|재무|매출|주가|예측|위험\s*등급|날씨|연락처|이메일/.test(normalize(question));

function intentFor(question) {
  const text = normalize(question);
  if (!text || forbiddenQuestion(text)) return 'unsupported';
  if (/과거|유사|계약|낙찰|수주|업체|사례|반복/.test(text)) return 'history';
  if (/자격|참가|조건|인증|확인해야|확인할/.test(text)) return 'requirements';
  if (/기술|요구|키워드|데이터|문서/.test(text)) return 'technology';
  if (/개요|요약|전체|설명|어떤\s*사업|무슨\s*사업|연결|관계/.test(text)) return 'overview';
  return 'unsupported';
}

/** 로컬 그래프의 실제 경로·가상 출처를 묶어 규칙형 검색 결과를 반환한다. */
function retrieveGraphEvidence(graph, noticeId, question, options = {}) {
  const context = getNoticeContext(graph, noticeId);
  const { nodes } = graphIndex(context);
  const focus = nodes.get(noticeId);
  const requestedFocus = options?.focusNodeId && options.focusNodeId !== noticeId ? options.focusNodeId : null;
  const intent = requestedFocus && !forbiddenQuestion(question) ? 'overview' : intentFor(question);
  const result = { supported: Boolean(focus) && intent !== 'unsupported', intent, summary: '', findings: [], paths: [], sources: [], relatedNodeIds: [], missing: [] };
  if (!focus) {
    result.summary = '선택한 공고를 그래프에서 찾을 수 없습니다.';
    result.missing.push('공고 식별자에 해당하는 가상 노드가 없습니다.');
    return result;
  }
  if (!result.supported) {
    result.summary = '이 질문은 현재 가상 그래프로 답변할 수 없습니다. 참가조건, 과거 계약, 요구기술 또는 사업 개요를 물어보세요.';
    result.missing.push('승률·가격 산정·신용·미래 예측은 지원하지 않습니다. LLM은 연결되어 있지 않습니다.');
    return result;
  }
  const sources = new Map();
  const edgeMap = new Map(context.edges.map(edge => [edge.id, edge]));
  const append = (id, title, text, status, target, label, types, allowedNodes, extraSourceNodes = []) => {
    const path = findPath(context, noticeId, target, types ? new Set(types) : null, allowedNodes);
    if (!path) { result.missing.push(`${title}: 공고에서 출처까지 이어지는 경로가 없습니다.`); return; }
    const evidence = path.edgeIds.flatMap(edgeId => edgeMap.get(edgeId).evidence);
    for (const nodeId of extraSourceNodes) if (nodes.has(nodeId)) evidence.push(nodeSource(nodes.get(nodeId)));
    if (!evidence.length) evidence.push(nodeSource(focus));
    for (const source of evidence) sources.set(source.id, { ...source, nodeId: source.id.slice('source:'.length) });
    result.paths.push({ id: `path:${id}`, label, ...path });
    result.findings.push({ id, title, text, status, sourceIds: unique(evidence.map(source => source.id)), nodeIds: [...path.nodeIds] });
  };

  if (requestedFocus) {
    const selected = nodes.get(requestedFocus);
    const path = selected ? findPath(context, noticeId, selected.id) : null;
    if (!path) {
      result.supported = false;
      result.summary = '선택한 노드를 이 공고와 연결하는 근거 경로가 없습니다.';
      result.missing.push('현재 공고의 표시 범위에서 확인할 수 없는 노드입니다.');
      return result;
    }
    const labels = { organization: '발주기관', notice: '공고', award: '낙찰 결과', contract: '계약', supplier: '업체', document: '문서', requirement: '참가조건', technology: '키워드' };
    const derived = path.edgeIds.some(edgeId => edgeMap.get(edgeId).status !== 'mock-key');
    const historical = path.nodeIds.some(nodeId => nodes.get(nodeId).meta.historical);
    const isMissing = (selected.type === 'contract' && !Number.isFinite(selected.meta.amount))
      || (selected.type === 'requirement' && !selected.meta.documentId);
    const caveat = historical ? ' 이 경로의 과거 사업은 현재 공고와 별도 사업이며 현재 공고의 계약을 뜻하지 않습니다.' : '';
    const typeNote = derived ? ' 경로에 분류 태그 또는 비교 후보에서 도출한 관계가 포함됩니다.' : ' 가상 행의 식별자를 사용한 연결 예시입니다.';
    append(`focus:${selected.id}`, selected.label, `${nodeSource(selected).excerpt}${typeNote}${caveat}`,
      isMissing ? 'missing' : derived || selected.type === 'requirement' ? 'needs-review' : 'supported', selected.id,
      `공고 → 선택한 ${labels[selected.type]}`, null, null, [selected.id]);
    result.summary = `선택한 ${labels[selected.type]}와 이 공고를 연결하는 경로입니다. 가상 그래프에서 검색한 결과이며 LLM이 생성한 답변이 아닙니다.`;
    if (isMissing) result.missing.push('선택한 노드의 금액 또는 문서 연결 근거가 없습니다.');
    result.sources = [...sources.values()];
    result.relatedNodeIds = unique(result.paths.flatMap(item => item.nodeIds));
    return result;
  }

  const addRequirements = () => {
    const requirements = context.nodes.filter(node => node.type === 'requirement' && node.meta.noticeId === noticeId);
    if (!requirements.length) {
      result.missing.push('연결된 참가조건이 없습니다. 조건을 충족한다고 판단할 수 없습니다.');
      append('requirements:missing', '참가조건 미확인', '이 공고에는 검토할 조건 예시가 연결되어 있지 않습니다.', 'missing', noticeId, '공고 기록 확인');
    }
    for (const requirement of requirements) {
      const hasDocument = Boolean(requirement.meta.documentId && nodes.has(requirement.meta.documentId));
      append(`requirements:${requirement.id}`, requirement.label, requirement.meta.detail, hasDocument ? 'needs-review' : 'missing', requirement.id,
        hasDocument ? '공고 → 문서 → 참가조건' : '공고 → 문서 미확인 조건', ['HAS_DOCUMENT', 'DESCRIBES', 'HAS_UNVERIFIED_REQUIREMENT']);
      if (!hasDocument) result.missing.push(`${requirement.label}: 인용할 원문 예시가 연결되어 있지 않습니다.`);
    }
  };
  const addHistory = () => {
    const historical = relatedHistory(context, noticeId);
    if (!historical.length) {
      result.missing.push('같은 분야의 과거 사업 후보가 없습니다.');
      append('history:missing', '과거 사업 미확인', '현재 그래프에는 비교할 과거 사업이 없습니다.', 'missing', noticeId, '공고 기록 확인');
    }
    for (const project of historical) {
      const family = context.nodes.filter(node => node.id === project.id || node.meta.noticeId === project.id);
      const contract = family.find(node => node.type === 'contract');
      const award = family.find(node => node.type === 'award');
      const supplier = project.meta.supplier ? nodes.get(`supplier:${token(project.meta.supplier)}`) : null;
      const allowed = new Set([noticeId, ...family.map(node => node.id), ...(supplier ? [supplier.id] : [])]);
      const target = contract && supplier ? supplier.id : contract?.id || award?.id || project.id;
      const text = contract
        ? `${project.meta.year}년 사업의 가상 계약 ${contract.meta.number}, ${money(contract.meta.amount)}. ${project.meta.supplier ? `업체: ${project.meta.supplier}.` : '계약업체 미확인.'} 현재 공고와는 같은 분야의 비교 후보입니다.`
        : award
          ? `${project.meta.year}년 낙찰 결과 ${award.meta.number}는 있으나 계약번호가 없습니다. 낙찰을 계약 체결로 해석하지 않습니다.`
          : `${project.meta.year}년 공고 기록만 있으며 낙찰·계약 연결은 미확인입니다.`;
      const complete = Boolean(contract && Number.isFinite(contract.meta.amount));
      append(`history:${project.id}`, project.label, text, complete ? 'supported' : 'missing', target,
        contract ? '현 공고 → 비교 후보 → 과거 낙찰·계약' : '현 공고 → 비교 후보 → 연결 누락 확인',
        ['SIMILAR_TO', 'HAS_AWARD', 'RESULTED_IN_CONTRACT', 'HAS_CONTRACT', 'CONTRACTED_WITH'], allowed, [project.id]);
      if (!contract) result.missing.push(`${project.label}: ${award ? '계약번호 미확인' : '낙찰·계약 미확인'}.`);
      else if (!Number.isFinite(contract.meta.amount)) result.missing.push(`${project.label}: 계약금액 미확인.`);
      if (contract && !project.meta.supplier) result.missing.push(`${project.label}: 계약업체 미확인.`);
    }
  };
  const addTechnology = () => {
    const technologies = context.edges.filter(edge => edge.source === noticeId && edge.type === 'HAS_TECHNOLOGY').map(edge => nodes.get(edge.target));
    if (!technologies.length) {
      result.missing.push('공고에 연결된 기술·분류 태그가 없습니다.');
      append('technology:missing', '기술 정보 미확인', '확인 가능한 기술 태그가 없어 요구기술을 설명할 수 없습니다.', 'missing', noticeId, '공고 기록 확인');
    }
    for (const technology of technologies) {
      const document = context.edges.filter(edge => edge.type === 'MENTIONS' && edge.target === technology.id)
        .map(edge => nodes.get(edge.source)).find(node => node?.meta.noticeId === noticeId);
      if (document) {
        append(`technology:${technology.id}`, technology.label, `가상 문서 '${document.label}'의 ${document.meta.section}에 해당 문구가 있습니다. 실제 요구 범위는 원문 검토가 필요합니다.`,
          'supported', technology.id, '공고 → 문서 → 키워드', ['HAS_DOCUMENT', 'MENTIONS'], new Set([noticeId, document.id, technology.id]));
      } else {
        append(`technology:${technology.id}`, technology.label, '공고의 분류 태그에 포함된 키워드입니다. 연결된 문서 발췌에서 동일 문구를 확인하지 못했으므로 필수 요구기술로 확정하지 않습니다.',
          'needs-review', technology.id, '공고 → 분류 키워드', ['HAS_TECHNOLOGY'], new Set([noticeId, technology.id]));
        result.missing.push(`${technology.label}: 연결 문서의 동일 문구 미확인.`);
      }
    }
  };

  if (intent === 'requirements') addRequirements();
  else if (intent === 'history') addHistory();
  else if (intent === 'technology') addTechnology();
  else {
    const organization = context.nodes.find(node => node.type === 'organization' && node.meta.organizationId === focus.meta.organizationId);
    append('overview:notice', '사업 개요', focus.meta.summary || focus.label, 'supported', organization?.id || noticeId, '공고 → 발주기관 예시', ['ISSUES'], new Set([noticeId, organization?.id].filter(Boolean)), [noticeId]);
    addRequirements();
    addHistory();
  }
  const summaries = {
    requirements: '공고에서 문서를 거쳐 참가조건까지 경로를 확인했습니다. 조건 충족 여부는 담당자가 확인해야 합니다.',
    history: '같은 분야의 비교 후보에서 낙찰·계약 경로를 찾았습니다. 현재 공고의 계약으로 연결하지 않았습니다.',
    technology: '공고 태그와 문서에 등장하는 키워드를 구분해 근거 경로를 찾았습니다.',
    overview: '발주기관, 문서의 참가조건, 유사 분야의 과거 사업을 함께 연결했습니다.',
  };
  result.summary = `${summaries[intent]} 모든 결과는 가상 데이터의 로컬 그래프 검색 예시입니다.`;
  result.sources = [...sources.values()];
  result.relatedNodeIds = unique(result.paths.flatMap(path => path.nodeIds));
  result.missing = unique(result.missing);
  return result;
}

return { buildKnowledgeGraph, getNoticeContext, retrieveGraphEvidence };
})();

/** 오프라인 Canvas 관계 탐색기. 투영·선택·접근성 컨트롤을 같은 그래프 상태로 유지합니다. */
const KG_TYPES = {
  organization: { label: '발주기관', color: '#e2b577', angle: -2.6, radius: 210 },
  notice: { label: '입찰공고', color: '#40c9a5', angle: -.7, radius: 148 },
  award: { label: '낙찰결과', color: '#93b5ff', angle: .35, radius: 205 },
  contract: { label: '계약', color: '#ed9fac', angle: .9, radius: 242 },
  supplier: { label: '조달업체', color: '#77c6e3', angle: 1.55, radius: 250 },
  document: { label: '문서', color: '#b4a3ef', angle: 2.5, radius: 180 },
  requirement: { label: '요구조건', color: '#d0b8e5', angle: -1.8, radius: 265 },
  technology: { label: '기술', color: '#7fbfc0', angle: -1.1, radius: 290 },
};
const kgEscape = (value = '') => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
const kgIcon = (name) => `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${({ plus:'<path d="M10 4v12M4 10h12"/>', minus:'<path d="M4 10h12"/>', reset:'<path d="M4.5 5.5A6.5 6.5 0 1 1 3.5 10M4.5 2v4h4"/>', arrow:'<path d="M4 10h12m-5-5 5 5-5 5"/>', orbit:'<ellipse cx="10" cy="10" rx="8" ry="3.5" transform="rotate(-30 10 10)"/><circle cx="10" cy="10" r="2"/>', chevron:'<path d="m8 5 5 5-5 5"/>' })[name] || ''}</svg>`;
const kgBindings = new WeakMap();

function renderGraphExplorer() {
  return `<section class="kg-explorer" aria-label="사업 관계 탐색"><div class="kg-heading"><div><span class="kg-eyebrow">RELATIONSHIP EXPLORER</span><h2>정보를 연결하면, 맥락이 보입니다.</h2></div><span class="kg-mock-label"><i></i> 목 데이터 그래프</span></div><div class="kg-stage"><div class="kg-toolbar"><div class="kg-view-switch" role="group" aria-label="그래프 표시 차원"><button type="button" data-kg-view="3d" aria-pressed="true">${kgIcon('orbit')} 3D</button><button type="button" data-kg-view="2d" aria-pressed="false">2D</button></div><div class="kg-path-switch" role="group" aria-label="강조할 관계"><button type="button" data-kg-path="all" aria-pressed="true">관계 전체</button><button type="button" data-kg-path="evidence" aria-pressed="false" disabled>근거 경로</button></div></div><canvas class="kg-canvas" tabindex="0" role="img" aria-label="사업 관계 그래프. 방향키로 회전, 더하기와 빼기로 확대 및 축소할 수 있습니다. 그래프 아래 항목 선택에서도 모든 노드를 탐색할 수 있습니다."></canvas><div class="kg-empty" hidden><strong>아직 연결된 관계가 없습니다.</strong><span>분석할 공고를 선택해 주세요.</span></div><div class="kg-canvas-bottom"><span class="kg-interaction-hint">드래그하여 회전 <i>·</i> 스크롤하여 확대</span><div class="kg-zoom-controls"><button type="button" data-kg-action="out" aria-label="관계 그래프 축소">${kgIcon('minus')}</button><span class="kg-zoom-value" aria-live="off">100%</span><button type="button" data-kg-action="in" aria-label="관계 그래프 확대">${kgIcon('plus')}</button><button type="button" data-kg-action="reset" aria-label="관계 그래프 시점 초기화">${kgIcon('reset')}</button></div></div><div class="kg-legend" aria-label="노드 범례">${['notice','organization','supplier','contract','document'].map(type => `<span><i style="--kg-dot:${KG_TYPES[type].color}"></i>${KG_TYPES[type].label}</span>`).join('')}<span class="kg-edge-legend"><i></i>파생·유사</span></div></div><div class="kg-accessible-bar"><label>연결된 항목 탐색<select class="kg-node-picker" aria-label="관계 그래프 항목 선택"><option value="">항목을 선택하세요</option></select></label><span class="kg-graph-count"></span></div><div class="kg-inspector" aria-label="선택한 항목의 관계"></div><div class="kg-selection-announcement kg-sr-only" role="status" aria-live="polite"></div></section>`;
}

/** 그래프 교체와 근거 경로 강조를 지원하며 영구 애니메이션 루프를 사용하지 않습니다. */
function bindGraphExplorer(container, { graph, focusId, onSelect = () => {} }) {
  const root = container.matches?.('.kg-explorer') ? container : container.querySelector('.kg-explorer');
  if (!root) throw new Error('관계 탐색기 마크업이 없습니다.');
  kgBindings.get(root)?.destroy();
  const canvas = root.querySelector('.kg-canvas');
  const ctx = canvas.getContext('2d');
  const picker = root.querySelector('.kg-node-picker');
  const controller = new AbortController();
  let current = { nodes: [], edges: [] };
  let nodesById = new Map();
  let positions = new Map();
  let projected = [];
  let focus = focusId;
  let selected = null;
  let hovered = null;
  let yaw = -.2;
  let pitch = -.16;
  let zoom = 1;
  let mode = '3d';
  let pathView = false;
  let pathNodes = new Set();
  let pathEdges = new Set();
  let width = 0;
  let height = 0;
  let ratio = 1;
  let frame = 0;
  let destroyed = false;
  let drag = null;
  let lastTouch = 0;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const hash = (value) => [...String(value)].reduce((result, char) => ((result << 5) - result + char.charCodeAt(0)) | 0, 17) >>> 0;
  const safeType = node => KG_TYPES[node.type] || KG_TYPES.notice;
  const announce = message => { root.querySelector('.kg-selection-announcement').textContent = message; };

  function layout() {
    const groups = new Map();
    current.nodes.forEach(node => {
      if (!groups.has(node.type)) groups.set(node.type, []);
      groups.get(node.type).push(node);
    });
    positions = new Map();
    groups.forEach(group => {
      group.sort((a, b) => String(a.id).localeCompare(String(b.id)));
      group.forEach((node, index) => {
        if (node.id === focus) { positions.set(node.id, { x: 0, y: 0, z: 0 }); return; }
        const type = safeType(node);
        const spread = (index - (group.length - 1) / 2) * .31;
        const seed = hash(node.id);
        const angle = type.angle + spread;
        const radius = type.radius + (index % 3 - 1) * 23;
        positions.set(node.id, { x: Math.cos(angle) * radius, y: Math.sin(angle) * radius * .67, z: ((seed % 241) - 120) * .85 });
      });
    });
  }

  function schedule() {
    if (!frame && !destroyed) frame = requestAnimationFrame(() => { frame = 0; draw(); });
  }

  function resize() {
    if (destroyed) return;
    const bounds = canvas.getBoundingClientRect();
    width = Math.max(1, bounds.width);
    height = Math.max(1, bounds.height);
    ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    schedule();
  }

  function project(node) {
    const position = positions.get(node.id);
    let { x, y, z } = position;
    if (mode === '3d') {
      const rx = x * Math.cos(yaw) + z * Math.sin(yaw);
      const rz = -x * Math.sin(yaw) + z * Math.cos(yaw);
      const ry = y * Math.cos(pitch) - rz * Math.sin(pitch);
      z = y * Math.sin(pitch) + rz * Math.cos(pitch);
      x = rx; y = ry;
    } else { z = 0; }
    const perspective = 800 / (800 + z);
    const scale = Math.min(width / 700, height / 465) * zoom;
    const radius = (node.id === focus ? 10 : node.type === 'notice' ? 7 : 5.7) * perspective;
    return { node, x: width / 2 + x * scale * perspective, y: height * .48 + y * scale * perspective, z, radius, perspective };
  }

  function line(from, to, edge, highlighted) {
    const related = selected && (edge.source === selected || edge.target === selected);
    const fade = pathView && !highlighted;
    const color = highlighted ? '#70dec2' : related ? '#8caeae' : '#53707d';
    ctx.globalAlpha = fade ? .13 : highlighted ? .95 : related ? .7 : .35;
    ctx.strokeStyle = color;
    ctx.lineWidth = highlighted ? 1.8 : related ? 1.15 : .8;
    ctx.setLineDash(edge.status === 'candidate' ? [3, 5] : edge.status === 'derived' ? [2, 3] : []);
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
    ctx.setLineDash([]);
    const direction = Math.atan2(to.y - from.y, to.x - from.x);
    const tipX = from.x + (to.x - from.x) * .82;
    const tipY = from.y + (to.y - from.y) * .82;
    ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.lineTo(tipX - Math.cos(direction - .45) * 4, tipY - Math.sin(direction - .45) * 4); ctx.moveTo(tipX, tipY); ctx.lineTo(tipX - Math.cos(direction + .45) * 4, tipY - Math.sin(direction + .45) * 4); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function draw() {
    if (!ctx || !width || !height || destroyed) return;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, width, height);
    const background = ctx.createRadialGradient(width * .48, height * .43, 20, width * .5, height * .5, width * .7);
    background.addColorStop(0, '#173a45'); background.addColorStop(.65, '#112b39'); background.addColorStop(1, '#102534');
    ctx.fillStyle = background; ctx.fillRect(0, 0, width, height);
    for (let index = 0; index < 72; index++) {
      const seed = hash(`kg-star-${index}`);
      ctx.fillStyle = `rgba(170,206,216,${index % 4 === 0 ? .14 : .06})`;
      ctx.beginPath(); ctx.arc((seed % 1000) / 1000 * width, ((seed >> 9) % 1000) / 1000 * height, index % 4 === 0 ? 1 : .6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = '#84b9bd12'; ctx.lineWidth = .7;
    ctx.beginPath(); ctx.ellipse(width / 2, height * .49, width * .33, height * .19, mode === '3d' ? -.17 : 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(width * .12, height * .48); ctx.lineTo(width * .88, height * .48); ctx.moveTo(width * .5, height * .14); ctx.lineTo(width * .5, height * .81); ctx.stroke();
    ctx.font = '8px system-ui, sans-serif'; ctx.fillStyle = '#92bac436'; ctx.fillText(mode === '3d' ? 'X' : '2D', width * .89, height * .49); ctx.fillText(mode === '3d' ? 'Y' : '', width * .5 + 6, height * .14);
    projected = current.nodes.map(project).sort((a, b) => b.z - a.z);
    const screen = new Map(projected.map(point => [point.node.id, point]));
    current.edges.forEach(edge => {
      const from = screen.get(edge.source); const to = screen.get(edge.target);
      if (from && to) line(from, to, edge, pathView && pathEdges.has(edge.id));
    });
    const occupied = [];
    const labelPoints = [];
    projected.forEach(point => {
      const { node, x, y, radius } = point;
      const chosen = node.id === selected;
      const active = chosen || node.id === hovered || node.id === focus;
      const onPath = pathNodes.has(node.id);
      ctx.globalAlpha = pathView && !onPath && !chosen ? .22 : 1;
      const color = safeType(node).color;
      const glow = ctx.createRadialGradient(x, y, radius * .4, x, y, radius * (active ? 4.5 : 3));
      glow.addColorStop(0, `${color}48`); glow.addColorStop(1, `${color}00`);
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, radius * (active ? 4.5 : 3), 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `${color}${chosen ? 'd9' : '66'}`; ctx.lineWidth = chosen ? 1.5 : .8;
      ctx.beginPath(); ctx.arc(x, y, radius + (chosen ? 5 : 2.5), 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f1fff0a1'; ctx.beginPath(); ctx.arc(x - radius * .18, y - radius * .2, radius * .25, 0, Math.PI * 2); ctx.fill();
      labelPoints.push({ ...point, priority: chosen ? 10 : node.id === hovered ? 9 : node.id === focus ? 8 : onPath && pathView ? 7 : ['organization','notice','contract','supplier'].includes(node.type) ? 3 : 1 });
    });
    ctx.globalAlpha = 1;
    labelPoints.sort((a, b) => b.priority - a.priority).forEach(point => {
      const { node, x, y, radius, priority } = point;
      if (pathView && !pathNodes.has(node.id) && node.id !== selected && priority < 7) return;
      const labelLimit = width < 400 ? (priority >= 7 ? 16 : 12) : (priority >= 7 ? 24 : 15);
      const text = node.label.length > labelLimit ? `${node.label.slice(0, labelLimit - 1)}…` : node.label;
      ctx.font = `${priority >= 7 ? '500 11' : '10'}px system-ui, -apple-system, sans-serif`;
      const textWidth = ctx.measureText(text).width;
      const bx = clamp(x - textWidth / 2 - 5, 4, Math.max(4, width - textWidth - 14));
      const by = y + radius + 9;
      const box = { x: bx, y: by, w: textWidth + 10, h: 18 };
      const overlaps = candidate => occupied.some(item => candidate.x < item.x + item.w && candidate.x + candidate.w > item.x && candidate.y < item.y + item.h && candidate.y + candidate.h > item.y);
      if (priority >= 7 && overlaps(box)) {
        for (const offset of [21, -21, 42, -42]) {
          const candidate = { ...box, y: by + offset };
          if (candidate.y >= 46 && candidate.y + 18 < height - 65 && !overlaps(candidate)) { box.y = candidate.y; break; }
        }
      }
      const collides = overlaps(box);
      if (priority < 7 && (collides || by > height - 65 || by < 43)) return;
      occupied.push(box);
      ctx.fillStyle = priority >= 7 ? '#102c38e8' : '#102b37c7'; ctx.fillRect(box.x, box.y, box.w, box.h);
      ctx.fillStyle = priority >= 7 ? '#f1fffa' : '#b0c8d1'; ctx.textBaseline = 'middle'; ctx.fillText(text, box.x + 5, box.y + 9); ctx.textBaseline = 'alphabetic';
    });
  }

  function metaRows(node) {
    const names = { budget: '배정예산', contractAmount: '계약금액', amount: '금액', category: '분야', year: '연도', region: '지역', status: '상태', source: '근거', section: '문서 조항', noticeNumber: '공고번호', contractNumber: '계약번호', bidNtceNo: '공고번호', bidNtceOrd: '공고차수', title: '명칭', organization: '발주기관', supplier: '업체', matchStatus: '연결 상태', sourceKey: '원천 키', sourceField: '원천 필드' };
    return Object.entries(node.meta || {}).filter(([key, value]) => names[key] && value != null && ['string','number','boolean'].includes(typeof value)).slice(0, 3).map(([key, value]) => `<span><small>${names[key]}</small>${kgEscape(typeof value === 'number' && /amount|budget/i.test(key) ? `${value.toLocaleString('ko-KR')}원` : value)}</span>`).join('');
  }

  function inspect() {
    const node = nodesById.get(selected);
    const inspector = root.querySelector('.kg-inspector');
    if (!node) { inspector.innerHTML = '<p class="kg-inspector-empty">항목을 선택하면 연결된 관계와 근거를 확인할 수 있습니다.</p>'; picker.value = ''; return; }
    const adjacent = current.edges.filter(edge => edge.source === node.id || edge.target === node.id);
    const type = safeType(node);
    inspector.innerHTML = `<div class="kg-selected-heading"><div><span class="kg-type-badge" style="--kg-dot:${type.color}"><i></i>${type.label}</span><h3>${kgEscape(node.label)}</h3></div><button type="button" class="kg-ask-button" data-kg-action="ask">이 관계로 질문 ${kgIcon('arrow')}</button></div><div class="kg-node-meta">${metaRows(node)}</div><div class="kg-adjacent-header">연결된 관계 <strong>${adjacent.length}</strong><span>공식 사실이 아닌 가상 관계 예시</span></div><div class="kg-adjacent-list">${adjacent.slice(0, 6).map(edge => {
      const other = nodesById.get(edge.source === node.id ? edge.target : edge.source);
      if (!other) return '';
      const status = edge.status === 'candidate' ? '유사 후보' : edge.status === 'derived' ? '파생 관계' : '예시 식별키';
      return `<button type="button" data-kg-node="${kgEscape(other.id)}" title="${kgEscape(`${edge.label || edge.type} · ${status} · ${other.label}`)}"><span class="kg-adjacent-type ${edge.status === 'candidate' ? 'is-candidate' : ''}">${kgEscape(edge.label || edge.type)}</span><span class="kg-adjacent-name">${kgEscape(other.label)}</span><small>${status}${edge.evidence?.length ? ` · 근거 ${edge.evidence.length}` : ''}</small>${kgIcon('chevron')}</button>`;
    }).join('') || '<span class="kg-no-relations">연결된 관계가 없습니다.</span>'}</div>${adjacent.length > 6 ? '<p class="kg-more-relations">나머지 항목은 위의 항목 선택 목록에서 확인할 수 있습니다.</p>' : ''}`;
    picker.value = node.id;
  }

  function controls() {
    root.querySelectorAll('[data-kg-view]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.kgView === mode)));
    root.querySelectorAll('[data-kg-path]').forEach(button => button.setAttribute('aria-pressed', String((button.dataset.kgPath === 'evidence') === pathView)));
    root.querySelector('[data-kg-path="evidence"]').disabled = !pathNodes.size;
    root.querySelector('.kg-zoom-value').textContent = `${Math.round(zoom * 100)}%`;
    root.querySelector('.kg-interaction-hint').innerHTML = mode === '3d' ? '드래그하여 회전 <i>·</i> 스크롤하여 확대' : '항목을 선택해 관계 확인 <i>·</i> 스크롤하여 확대';
    root.querySelector('[data-kg-action="out"]').disabled = zoom <= .65;
    root.querySelector('[data-kg-action="in"]').disabled = zoom >= 2.2;
  }

  function selectNode(id, emit = true) {
    if (!nodesById.has(id) || destroyed) return;
    const changed = selected !== id;
    selected = id;
    inspect(); schedule();
    announce(`${safeType(nodesById.get(id)).label}, ${nodesById.get(id).label} 선택됨`);
    if (emit && changed) onSelect(nodesById.get(id));
  }

  function setGraph(nextGraph, nextFocusId) {
    if (destroyed) return;
    const inputNodes = Array.isArray(nextGraph?.nodes) ? nextGraph.nodes : [];
    nodesById = new Map(inputNodes.filter(node => node && node.id && typeof node.label === 'string').map(node => [node.id, node]));
    current = { nodes: [...nodesById.values()], edges: (Array.isArray(nextGraph?.edges) ? nextGraph.edges : []).filter(edge => edge && nodesById.has(edge.source) && nodesById.has(edge.target)) };
    focus = nodesById.has(nextFocusId) ? nextFocusId : current.nodes[0]?.id;
    selected = focus || null;
    hovered = null;
    pathNodes = new Set(); pathEdges = new Set(); pathView = false;
    yaw = -.2; pitch = -.16; zoom = 1;
    layout();
    const types = Object.keys(KG_TYPES);
    picker.innerHTML = current.nodes.length ? types.map(type => {
      const nodes = current.nodes.filter(node => node.type === type);
      return nodes.length ? `<optgroup label="${KG_TYPES[type].label}">${nodes.map(node => `<option value="${kgEscape(node.id)}">${kgEscape(node.label)}</option>`).join('')}</optgroup>` : '';
    }).join('') : '<option value="">연결된 항목 없음</option>';
    picker.disabled = !current.nodes.length;
    root.querySelector('.kg-graph-count').textContent = `${current.nodes.length}개 항목 · ${current.edges.length}개 관계`;
    root.querySelector('.kg-empty').hidden = Boolean(current.nodes.length);
    inspect(); controls(); schedule();
  }

  function highlightPath(nodeIds = [], edgeIds = []) {
    pathNodes = new Set(nodeIds.filter(id => nodesById.has(id)));
    pathEdges = new Set(edgeIds.filter(id => current.edges.some(edge => edge.id === id)));
    current.edges.filter(edge => pathEdges.has(edge.id)).forEach(edge => { pathNodes.add(edge.source); pathNodes.add(edge.target); });
    pathView = pathNodes.size > 0;
    controls(); schedule();
    announce(pathView ? `근거 경로 ${pathNodes.size}개 항목, ${pathEdges.size}개 관계를 강조합니다.` : '전체 관계를 표시합니다.');
  }

  function setZoom(value) { zoom = clamp(value, .65, 2.2); controls(); schedule(); }
  function pick(x, y) {
    return [...projected].reverse().filter(point => !pathView || pathNodes.has(point.node.id) || point.node.id === selected).find(point => Math.hypot(point.x - x, point.y - y) <= Math.max(point.radius + 8, 15))?.node;
  }
  function pointFromEvent(event) { const bounds = canvas.getBoundingClientRect(); return { x: event.clientX - bounds.left, y: event.clientY - bounds.top }; }
  function pointerEnd(event) {
    if (!drag || drag.pointerId !== event.pointerId) return;
    const point = pointFromEvent(event);
    if (drag.distance < 5 && event.type !== 'pointercancel') {
      const node = pick(point.x, point.y);
      if (node) selectNode(node.id);
    }
    drag = null; canvas.classList.remove('is-dragging');
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
  }

  root.addEventListener('click', event => {
    const button = event.target.closest('button'); if (!button || !root.contains(button)) return;
    if (button.dataset.kgNode) { selectNode(button.dataset.kgNode); return; }
    if (button.dataset.kgView) { mode = button.dataset.kgView; controls(); schedule(); announce(`${mode === '3d' ? '3차원' : '2차원'} 보기`); return; }
    if (button.dataset.kgPath) { pathView = button.dataset.kgPath === 'evidence' && pathNodes.size > 0; controls(); schedule(); return; }
    switch (button.dataset.kgAction) {
      case 'in': setZoom(zoom + .15); break;
      case 'out': setZoom(zoom - .15); break;

}

function noticeCard(n,compact=false) {

}
function miniMarket() {
  const rows = categories.map(category => ({category,amount:historicalProjects.filter(p=>p.year===2026&&p.category===category&&p.contractNumber&&p.contractAmount!=null).reduce((sum,p)=>sum+p.contractAmount,0)})).filter(p=>profile.categories.includes(p.category));
  const max = Math.max(...rows.map(r=>r.amount),1);
  return `<div class="market-mini-layout"><div class="market-mini-total"><span>관심 분야 계약 규모</span><strong>${money(rows.reduce((s,r)=>s+r.amount,0))}<small> 원</small></strong><span class="muted">확인된 계약 기준</span></div><div class="mini-bars">${rows.map(r=>`<div><span>${e(r.category)}</span><div><i style="width:${r.amount/max*100}%"></i></div><strong>${money(r.amount)}</strong></div>`).join('') || '<p class="muted">관심 분야를 설정해 주세요.</p>'}</div></div>`;
}

ected':''}>${l}</option>`).join('')}</select></label></div><div id="search-results" class="panel results-list"></div><p class="results-note">${icon('info')} 관련도는 관심 분야와 키워드로 계산한 시연 점수입니다. 참가 자격은 공고 원문에서 확인해 주세요.</p>`;

  const dialog=$('#settings-dialog');
  dialog.setAttribute('aria-label','기업 프로필');
  dialog.innerHTML=`<div class="dialog-header"><span class="eyebrow">COMPANY PROFILE</span><button class="icon-button" data-close="settings-dialog" aria-label="프로필 닫기">${icon('close')}</button></div><form id="profile-form"><h2>우리 회사에 맞는 신호를 받아보세요.</h2><p class="muted">입력한 분야와 키워드가 맞춤 공고의 기준이 됩니다.</p><label class="form-field">기업명<input name="companyName" value="${e(profile.companyName)}" required maxlength="40"></label><label class="form-field">사업 지역<select name="region">${['서울','경기','대전','전국'].map(r=>`<option ${profile.region===r?'selected':''}>${r}</option>`).join('')}</select></label><fieldset class="profile-categories"><legend>관심 사업 분야 <small>여러 개를 선택할 수 있어요</small></legend>${categories.map(c=>`<label><input type="checkbox" name="categories" value="${e(c)}" ${profile.categories.includes(c)?'checked':''}><span>${e(c)}</span></label>`).join('')}</fieldset><label class="form-field">보유 역량 · 검색 키워드<input name="keywords" value="${e(profile.keywords.join(', '))}" placeholder="데이터 플랫폼, AI, 클라우드" maxlength="200"><small>쉼표로 구분해 입력해 주세요.</small></label><p class="form-note">${icon('info')} 이 브라우저에만 저장됩니다. 사업 지역은 프로필 정보로 보관하며, 자격을 자동 판정하지 않습니다.</p><button type="submit" class="button primary full-width">${icon('check')} 프로필 저장</button></form>`;
  if(!dialog.open)dialog.showModal();
  $('#profile-form').addEventListener('submit',event=>{
    event.preventDefault();const data=new FormData(event.currentTarget);
    const name=data.get('companyName').trim();if(!name){event.currentTarget.elements.companyName.setCustomValidity('기업명을 입력해 주세요.');event.currentTarget.reportValidity();return;}
    profile={...profile,companyName:name,region:data.get('region'),categories:data.getAll('categories'),keywords:data.get('keywords').split(',').map(s=>s.trim()).filter(Boolean)};
    persist('bizsignal.profile.v1',profile);dialog.close();render();notify('기업 프로필을 저장하고 맞춤 공고를 업데이트했어요.');
  });
  $('#profile-form').elements.companyName.addEventListener('input',event=>event.target.setCustomValidity(''));
}
function openGuide() {
  const dialog=$('#settings-dialog');dialog.setAttribute('aria-label','데이터 이용 안내');
  dialog.innerHTML=`<div class="dialog-header"><span class="eyebrow">ABOUT THE DATA</span><button class="icon-button" data-close="settings-dialog" aria-label="안내 닫기">${icon('close')}</button></div><h2>데이터를 이해하면 판단이 명확해집니다.</h2><p class="muted">공식 API 문서의 구조를 참고해 만든 가상 워크스페이스입니다. 실제 공고·계약 또는 AI 모델과 연결되어 있지 않습니다.</p><div class="guide-facts"><p><strong>예산 ≠ 계약금액</strong><br>공고의 배정예산과 과거 계약의 금액을 별도로 표시합니다.</p><p><strong>낙찰 이후 계약이 없을 수도 있어요</strong><br>확인되지 않은 관계는 ‘미확인’으로 표시하고 집계에서 제외합니다.</p><p><strong>추천은 검토 순서를 돕는 정보</strong><br>참가 자격과 수주 확률을 보증하지 않습니다. 문서 발췌도 가상 예시입니다.</p><p><strong>공시 정보는 선택 확장</strong><br>사업자번호 일치를 검증한 업체만 연결하며, 이 시연에서는 공시 수치를 만들지 않았습니다.</p></div><h3>참고한 공식 데이터 문서</h3><div class="source-list">${sourceDocuments.map(s=>`<a href="${e(s.url)}" target="_blank" rel="noopener noreferrer"><span><small>${e(s.id)}</small><strong>${e(s.name)}</strong></span>${icon('external')}</a>`).join('')}</div><p class="form-note">모든 기관명, 사업명, 금액과 일정은 시연용입니다. 기준일은 2026년 11월 13일로 고정되어 있습니다.</p>`;
  if(!dialog.open)dialog.showModal();
}
function exportList() {
  const list=currentPage==='watchlist'?notices.filter(n=>saved.includes(n.id)&&(watchFilter==='전체'||(stages[n.id]||'검토 전')===watchFilter)):filterNotices(notices,filters,profile,DEMO_NOW);
  const rows=[['데이터 구분','공고번호','차수','공고명','수요기관','분야','배정예산(원)','마감일시','검토단계'],...list.map(n=>['가상 시연 데이터',n.bidNtceNo,n.bidNtceOrd,n.title,n.organization,n.category,n.budget,n.deadline,stages[n.id]||'검토 전'])];
  const url=URL.createObjectURL(new Blob([csvContent(rows)],{type:'text/csv;charset=utf-8;'}));const link=document.createElement('a');link.href=url;link.download='BizSignal_가상공고_20261113.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify(`${list.length}건의 가상 공고 목록을 내려받았어요.`);
}

function bindPage() {
  if(currentPage==='explore') {
    updateResults();$('#search-form').addEventListener('submit',event=>{event.preventDefault();filters.query=$('#notice-search').value;updateResults();});
    $('#notice-search').addEventListener('input',event=>{filters.query=event.target.value;updateResults();});
    for(const [id,key] of [['category-filter','category'],['region-filter','region'],['budget-filter','budget'],['sort-filter','sort']]) $(`#${id}`).addEventListener('change',event=>{filters[key]=event.target.value;updateResults();});
    $('#week-filter').addEventListener('change',event=>{filters.withinDays=event.target.checked?7:0;updateResults();});
    $('#open-filter').addEventListener('change',event=>{filters.openOnly=event.target.checked;updateResults();});
  }
  if(currentPage==='market')bindMarket($('#main'),{historicalProjects,notices});
  if(currentPage==='evidence'){
    bindEvidence($('#main'),{notices,historicalProjects});
    const pending=pendingEvidenceId;
    if(pending){const select=$('#main [name="evidence-notice"]');if(select&&[...select.options].some(o=>o.value===pending)){select.value=pending;select.dispatchEvent(new Event('change',{bubbles:true}));}pendingEvidenceId=null;}
  }
}
document.addEventListener('click',event=>{
  const target=event.target.closest('button,a,[data-action]');if(!target)return;
  if(target.classList.contains('skip-link')){event.preventDefault();$('#main').focus();return;}
  if(target.dataset.close){$(`#${target.dataset.close}`).close();return;}
  if(target.dataset.save){const id=target.dataset.save;const added=!saved.includes(id);saved=added?[...saved,id]:saved.filter(v=>v!==id);persist('bizsignal.saved.v1',saved);render();if($('#detail-dialog').open)openDetail(detailId,detailTab);notify(added?'관심 사업에 저장했어요. 변경과 마감을 함께 확인하세요.':'관심 사업에서 해제했어요.');return;}
  if(target.dataset.detail){openDetail(target.dataset.detail,target.dataset.detailTab||'overview');return;}
  if(target.dataset.detailTabButton){openDetail(detailId,target.dataset.detailTabButton);return;}
  if(target.dataset.nav){navigate(target.dataset.nav);return;}
  if(target.dataset.dashboardTab){dashboardTab=target.dataset.dashboardTab;render();return;}
  if(target.dataset.metric){if(target.dataset.page==='explore'){filters={...filters,matched:true,query:'',category:'',region:'',budget:'',openOnly:true,withinDays:target.dataset.metric==='7일 이내 마감'?7:0,sort:target.dataset.metric==='7일 이내 마감'?'deadline':'match'};}navigate(target.dataset.page);return;}
  if(target.dataset.matchFilter){filters.matched=target.dataset.matchFilter==='true';render();return;}
  if(target.dataset.watchFilter){watchFilter=target.dataset.watchFilter;render();return;}
  if(target.dataset.alertFilter){alertFilter=target.dataset.alertFilter;render();return;}
  if(target.dataset.read){read=[...new Set([...read,target.dataset.read])];persist('bizsignal.read.v1',read);render();notify('변경 내용을 확인 처리했어요.');return;}
  switch(target.dataset.action){
    case 'profile':openProfile();break;
    case 'guide':openGuide();break;
    case 'matched':filters={...filters,matched:true,query:'',category:'',region:'',budget:'',openOnly:true,withinDays:0,sort:'match'};navigate('explore');break;
    case 'reset':filters={query:'',category:'',region:'',budget:'',sort:'match',openOnly:true,matched:false,withinDays:0};render();break;
    case 'explore':navigate('explore');break;
    case 'watchlist':navigate('watchlist');break;
    case 'menu':document.body.classList.toggle('menu-open');syncMenu();break;
    case 'close-menu':document.body.classList.remove('menu-open');syncMenu();break;
    case 'export':exportList();break;
    case 'read-all':read=[...new Set([...read,...watchedChanges().map(c=>c.key)])];persist('bizsignal.read.v1',read);render();notify('모든 관심 사업 변경을 확인 처리했어요.');break;
    case 'ask-about':$('#detail-dialog').close();pendingEvidenceId=target.dataset.notice;navigate('evidence');break;
  }
});
document.addEventListener('change',event=>{if(event.target.dataset.stage){stages[event.target.dataset.stage]=event.target.value;persist('bizsignal.stages.v1',stages);render();notify('검토 단계를 변경했어요.');}});
window.addEventListener('hashchange',()=>{currentPage=Object.hasOwn(pages,location.hash.slice(1))?location.hash.slice(1):'dashboard';document.body.classList.remove('menu-open');render();window.scrollTo(0,0);});
for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close();}});
render();

return {  };
})();
})();
</script>
